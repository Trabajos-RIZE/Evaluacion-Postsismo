        // Simple assertion helper
        function assert(condition, message) {
            if (!condition) {
                throw new Error(`❌ Assertion failed: ${message}`);
            }
            return message;
        }

        function assertEqual(actual, expected, message) {
            if (actual !== expected) {
                throw new Error(`❌ Assertion failed: ${message}\n   Expected: ${expected}\n   Actual: ${actual}`);
            }
            return message;
        }

        function assertTrue(condition, message) {
            assert(condition === true, message);
            return message;
        }

        function assertFalse(condition, message) {
            assert(condition === false, message);
            return message;
        }

        function testC1Dominance_ColumnCrush() {
            const rules = { schema_version: '1.0' };
            const assessment = {
                damages: {
                    'partial_collapse': 'NO',
                    'total_collapse': 'NO',
                    'column_crush': 'YES',
                    'column_displaced': 'NO',
                    'tilt': 'NO',
                    'loss_support': 'NO',
                    'gas': 'NO',
                    'fire': 'NO',
                    'electric': 'NO',
                    'column_diag_crack': 'NO',
                    'column_steel': 'NO',
                    'beam_diag_crack': 'NO',
                    'wall_diag': 'NO',
                    'wall_out_plane': 'NO',
                    'foundation_damage': 'NO',
                    'settlement': 'NO',
                    'landslide': 'NO',
                    'masonry_diag': 'NO',
                    'masonry_out_plane': 'NO',
                    'facade_fall': 'NO',
                    'minor_crack': 'NO',
                    'debris': 'NO',
                    'suspended_hazard': 'NO',
                    'ground_cracks': 'NO',
                    'hvac_damage': 'NO',
                    'partition_damage': 'NO'
                }
            };

            const result = TriageModule.evaluateAssessment(assessment, rules);

            assertEqual(result.level, '🔴 P1', 'Level must be P1 for critical column crush');
            assertEqual(result.result_code, 'PREVENTIVE_EVACUATION', 'Result code must be PREVENTIVE_EVACUATION');
            assertTrue(result.requiresTechnicalInspection, 'Technical inspection required for P1');
            assert(result.reasons.some(r => r.condition === 'column_crush'), 'Must document column_crush reason');
        }

        // Run all tests
        function runAllTests() {

                { name: 'C3 Dominance - Debris', fn: testC3Dominance_Debris },
                { name: 'Safe Building - All NO', fn: testSafeBuilding_AllNo },
                { name: 'Empty Assessment', fn: testEmptyAssessment },
                { name: 'Rule Version Traceability', fn: testRuleVersionTraceability }
            ];

            let passed = 0;
            let failed = 0;
            const output = document.getElementById('test-output');
            const summary = document.getElementById('summary');

            for (const test of tests) {
                try {
                    test.fn();
                    
                    const testDiv = document.createElement('div');
                    testDiv.className = 'test-case test-pass';
                    testDiv.innerHTML = `<div class="test-title">✅ ${test.name}</div>`;
                    output.appendChild(testDiv);
                    passed++;
                } catch (error) {
                    const testDiv = document.createElement('div');
                    testDiv.className = 'test-case test-fail';
                    testDiv.innerHTML = `<div class="test-title">❌ ${test.name}</div>
                                        <div class="assertion">${error.message.replace(/\n/g, '<br>')}</div>`;
                    output.appendChild(testDiv);
                    failed++;
                }
            }

            const summaryHTML = `
                <div class="summary-line"><span class="passed">✅ Passed: ${passed}</span></div>
                <div class="summary-line"><span class="failed">❌ Failed: ${failed}</span></div>
                <div class="summary-line"><span class="total">📊 Total: ${tests.length}</span></div>
            `;
            summary.innerHTML = summaryHTML;
        }

        // Run tests when page loads
        window.addEventListener('load', runAllTests);
