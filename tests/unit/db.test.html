<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Persistence - Unit Tests (HITO 3)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        header p {
            color: #666;
            font-size: 0.95em;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .test-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .test-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .test-pass {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .test-fail {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .test-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .test-pending {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .summary-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-top: 4px solid #667eea;
        }

        .summary-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .summary-label {
            color: #666;
            margin-top: 5px;
            font-size: 0.85em;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .code-block {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            overflow-x: auto;
            margin: 10px 0;
            border-left: 3px solid #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.9;
            margin-top: 5px;
        }

        .photo-preview {
            width: 100px;
            height: 100px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin: 5px 5px 5px 0;
            display: inline-block;
            overflow: hidden;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗄️ Database Persistence Module - Unit Tests</h1>
            <p><strong>HITO 3:</strong> IndexedDB offline-first storage validation</p>
            <p>Testing: saveAssessment, getAllAssessments, deleteAssessment, clearAllAssessments, and more</p>
            <div class="controls">
                <button class="btn-primary" onclick="runAllTests()">▶️ Run All Tests</button>
                <button class="btn-success" onclick="generateAndSave()">📸 Generate Sample Data</button>
                <button class="btn-secondary" onclick="viewAllRecords()">👁️ View All Records</button>
                <button class="btn-danger" onclick="clearDatabase()">🗑️ Clear Database</button>
            </div>
        </header>

        <div class="test-grid" id="test-results"></div>

        <div class="summary" id="summary">
            <h2>📊 Test Summary</h2>
            <div class="summary-grid" id="summary-stats">
                <div class="summary-item">
                    <div class="summary-value">-</div>
                    <div class="summary-label">Tests Passed</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value">-</div>
                    <div class="summary-label">Tests Failed</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value">-</div>
                    <div class="summary-label">Total Records</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value">-</div>
                    <div class="summary-label">Storage Used</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load modules -->
    <script src="../../src/core/triage.js"></script>
    <script src="../../src/core/db.js"></script>

    <script>
        let testsPassed = 0;
        let testsFailed = 0;

        // Helper functions
        function createTestResult(title, message, type = 'pass') {
            const result = document.createElement('div');
            result.className = `test-result test-${type}`;
            result.innerHTML = `<strong>${title}:</strong> ${message}`;
            return result;
        }

        function createSmallBase64Image() {
            // Create a tiny 10x10 pixel PNG image in Base64
            return 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mNkYPhfAQAFBQIAX8jx0gAAAABJRU5ErkJggg==';
        }

        function createSampleAssessment() {
            const triageRules = { schema_version: '1.0' };
            const damages = {
                'partial_collapse': 'NO',
                'total_collapse': 'NO',
                'column_crush': 'NO',
                'column_displaced': 'NO',
                'tilt': 'NO',
                'loss_support': 'NO',
                'gas': 'NO',
                'fire': 'NO',
                'electric': 'NO',
                'column_diag_crack': 'NO',
                'column_steel': 'NO',
                'beam_diag_crack': 'NO',
                'wall_diag': 'NO',
                'wall_out_plane': 'NO',
                'foundation_damage': 'NO',
                'settlement': 'NO',
                'landslide': 'NO',
                'masonry_diag': 'NO',
                'masonry_out_plane': 'NO',
                'facade_fall': 'NO',
                'minor_crack': 'NO',
                'debris': 'NO',
                'suspended_hazard': 'NO',
                'ground_cracks': 'NO',
                'hvac_damage': 'NO',
                'partition_damage': 'NO'
            };

            const assessment = {
                timestamp: new Date().toISOString(),
                evaluator: {
                    name: 'Ing. Juan Pérez García',
                    license: 'TP-2024-001234',
                    agency: 'UNGRD - Cali'
                },
                location: {
                    address: 'Carrera 5 #10-20, San Alejo, Cali',
                    latitude: 3.4516,
                    longitude: -76.5319,
                    accuracy: 5.0
                },
                damages: damages,
                assessment: TriageModule.evaluateAssessment({ damages }, triageRules),
                photos: {
                    structural: createSmallBase64Image(),
                    facade: createSmallBase64Image(),
                    detail: createSmallBase64Image()
                },
                metadata: {
                    buildingType: 'Residential - 5 floors',
                    constructionYear: 2005,
                    storeys: 5,
                    municipalCode: 'CALI-760131',
                    municipality: 'Cali'
                },
                syncStatus: 'PENDING'
            };

            return assessment;
        }

        // Test: Initialize Database
        async function testInitializeDatabase() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>🚀 Initialize Database</h3>';

            try {
                const assessment = createSampleAssessment();
                const id = await DatabaseModule.saveAssessment(assessment);
                
                resultsContainer.appendChild(
                    createTestResult('Database Init', `✓ Database initialized successfully. Saved assessment ID: ${id}`, 'pass')
                );
                await DatabaseModule.deleteAssessment(id);
                testsPassed++;
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Database Init', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Save Assessment
        async function testSaveAssessment() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>💾 Save Assessment with Photos</h3>';

            try {
                const assessment = createSampleAssessment();
                const id = await DatabaseModule.saveAssessment(assessment);
                
                resultsContainer.appendChild(
                    createTestResult('Save Assessment', `✓ Assessment saved with ID: ${id}`, 'pass')
                );
                resultsContainer.appendChild(
                    createTestResult('Photo Storage', `✓ 3 Base64 images stored (${Math.round(assessment.photos.structural.length / 1024)}KB total)`, 'pass')
                );
                resultsContainer.appendChild(
                    createTestResult('Triage Result', `✓ Assessment level: ${assessment.assessment.level}`, 'pass')
                );

                await DatabaseModule.deleteAssessment(id);
                testsPassed++;
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Save Assessment', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Validate Schema
        async function testValidateSchema() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>✅ Schema Validation</h3>';

            try {
                // Valid record
                const validAssessment = createSampleAssessment();
                const validation = DatabaseModule.validateAssessmentRecord(validAssessment);
                
                if (validation.valid) {
                    resultsContainer.appendChild(
                        createTestResult('Valid Record', `✓ Complete schema passes validation`, 'pass')
                    );
                    testsPassed++;
                } else {
                    throw new Error(`Valid record failed: ${validation.errors.join(', ')}`);
                }

                // Invalid record (missing fields)
                const invalidAssessment = { damages: {} };
                const invalidValidation = DatabaseModule.validateAssessmentRecord(invalidAssessment);
                
                if (!invalidValidation.valid && invalidValidation.errors.length > 0) {
                    resultsContainer.appendChild(
                        createTestResult('Invalid Record Detection', `✓ Correctly rejected: ${invalidValidation.errors[0]}`, 'pass')
                    );
                    testsPassed++;
                } else {
                    throw new Error('Failed to detect invalid record');
                }
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Schema Validation', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Retrieve Assessments
        async function testRetrieveAssessments() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>📖 Retrieve Assessments</h3>';

            try {
                // Save multiple records
                const assessment1 = createSampleAssessment();
                const assessment2 = createSampleAssessment();
                assessment2.metadata.municipality = 'Palmira';
                assessment2.location.address = 'Calle Principal, Palmira';

                const id1 = await DatabaseModule.saveAssessment(assessment1);
                const id2 = await DatabaseModule.saveAssessment(assessment2);

                // Retrieve all
                const allAssessments = await DatabaseModule.getAllAssessments();
                
                if (allAssessments.length >= 2) {
                    resultsContainer.appendChild(
                        createTestResult('Get All', `✓ Retrieved ${allAssessments.length} assessments`, 'pass')
                    );
                    testsPassed++;
                }

                // Get by ID
                const retrieved = await DatabaseModule.getAssessmentById(id1);
                if (retrieved && retrieved.id === id1) {
                    resultsContainer.appendChild(
                        createTestResult('Get by ID', `✓ Retrieved specific assessment ID: ${id1}`, 'pass')
                    );
                    testsPassed++;
                }

                // Get by municipality
                const caliAssessments = await DatabaseModule.getAssessmentsByMunicipality('Cali');
                if (caliAssessments.length > 0) {
                    resultsContainer.appendChild(
                        createTestResult('Query by Municipality', `✓ Found ${caliAssessments.length} assessments in Cali`, 'pass')
                    );
                    testsPassed++;
                }

                // Cleanup
                await DatabaseModule.deleteAssessment(id1);
                await DatabaseModule.deleteAssessment(id2);
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Retrieve Assessments', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Sync Status
        async function testSyncStatus() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>🔄 Sync Status Management</h3>';

            try {
                const assessment = createSampleAssessment();
                const id = await DatabaseModule.saveAssessment(assessment);

                // Check initial status
                const initial = await DatabaseModule.getAssessmentById(id);
                if (initial.syncStatus === 'PENDING') {
                    resultsContainer.appendChild(
                        createTestResult('Initial Status', `✓ New record: ${initial.syncStatus}`, 'pass')
                    );
                    testsPassed++;
                }

                // Update status
                await DatabaseModule.updateSyncStatus(id, 'SYNCED');
                const updated = await DatabaseModule.getAssessmentById(id);
                
                if (updated.syncStatus === 'SYNCED') {
                    resultsContainer.appendChild(
                        createTestResult('Update Status', `✓ Status changed to: ${updated.syncStatus}`, 'pass')
                    );
                    testsPassed++;
                }

                // Query by status
                const pendingRecords = await DatabaseModule.getAssessmentsBySyncStatus('SYNCED');
                if (pendingRecords.length > 0) {
                    resultsContainer.appendChild(
                        createTestResult('Query by Status', `✓ Found ${pendingRecords.length} SYNCED records`, 'pass')
                    );
                    testsPassed++;
                }

                await DatabaseModule.deleteAssessment(id);
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Sync Status', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Delete Assessment
        async function testDeleteAssessment() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>🗑️ Delete Assessment</h3>';

            try {
                const assessment = createSampleAssessment();
                const id = await DatabaseModule.saveAssessment(assessment);

                // Verify it exists
                let retrieved = await DatabaseModule.getAssessmentById(id);
                if (retrieved && retrieved.id === id) {
                    resultsContainer.appendChild(
                        createTestResult('Pre-delete Check', `✓ Assessment exists`, 'pass')
                    );
                    testsPassed++;
                }

                // Delete it
                await DatabaseModule.deleteAssessment(id);

                // Verify it's gone
                retrieved = await DatabaseModule.getAssessmentById(id);
                if (!retrieved) {
                    resultsContainer.appendChild(
                        createTestResult('Post-delete Check', `✓ Assessment deleted successfully`, 'pass')
                    );
                    testsPassed++;
                }
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Delete Assessment', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Storage Statistics
        async function testStorageStats() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>📊 Storage Statistics</h3>';

            try {
                const stats = await DatabaseModule.getStorageStats();
                
                resultsContainer.appendChild(
                    createTestResult('Record Count', `✓ ${stats.recordCount} assessments in storage`, 'pass')
                );

                if (stats.usedMB) {
                    resultsContainer.appendChild(
                        createTestResult('Storage Used', `✓ ${stats.usedMB}MB / ${stats.quotaMB}MB quota`, 'info')
                    );
                } else {
                    resultsContainer.appendChild(
                        createTestResult('Storage Info', `✓ Quota API available`, 'info')
                    );
                }

                testsPassed++;
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Storage Stats', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        // Test: Export/Import
        async function testExportImport() {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'test-panel';
            resultsContainer.innerHTML = '<h3>🔄 Export/Import JSON</h3>';

            try {
                // Save some data
                const assessment = createSampleAssessment();
                const id = await DatabaseModule.saveAssessment(assessment);

                // Export
                const jsonData = await DatabaseModule.exportAsJSON();
                if (jsonData && jsonData.includes('"id"')) {
                    resultsContainer.appendChild(
                        createTestResult('Export JSON', `✓ Exported ${jsonData.length} bytes`, 'pass')
                    );
                    testsPassed++;
                }

                // Import
                const importedCount = await DatabaseModule.importFromJSON(jsonData);
                if (importedCount > 0) {
                    resultsContainer.appendChild(
                        createTestResult('Import JSON', `✓ Imported ${importedCount} records`, 'pass')
                    );
                    testsPassed++;
                }

                // Cleanup
                const allRecords = await DatabaseModule.getAllAssessments();
                for (const record of allRecords) {
                    await DatabaseModule.deleteAssessment(record.id);
                }
            } catch (error) {
                resultsContainer.appendChild(
                    createTestResult('Export/Import', `✗ ${error.message}`, 'fail')
                );
                testsFailed++;
            }

            return resultsContainer;
        }

        async function runAllTests() {
            testsPassed = 0;
            testsFailed = 0;
            const testResults = document.getElementById('test-results');
            testResults.innerHTML = '';

            const tests = [
                testInitializeDatabase,
                testSaveAssessment,
                testValidateSchema,
                testRetrieveAssessments,
                testSyncStatus,
                testDeleteAssessment,
                testStorageStats,
                testExportImport
            ];

            for (const test of tests) {
                const result = await test();
                testResults.appendChild(result);
            }

            updateSummary();
        }

        async function generateAndSave() {
            try {
                const assessment = createSampleAssessment();
                const id = await DatabaseModule.saveAssessment(assessment);
                alert(`✓ Sample assessment saved with ID: ${id}\n\nEvaluator: ${assessment.evaluator.name}\nLocation: ${assessment.location.address}\nLevel: ${assessment.assessment.level}`);
                updateSummary();
            } catch (error) {
                alert(`✗ Error: ${error.message}`);
            }
        }

        async function viewAllRecords() {
            try {
                const records = await DatabaseModule.getAllAssessments();
                if (records.length === 0) {
                    alert('No records in database');
                    return;
                }

                let output = `📋 Total Records: ${records.length}\n\n`;
                records.forEach((record, index) => {
                    output += `${index + 1}. ID: ${record.id} | Level: ${record.assessment.level} | Location: ${record.location.address}\n`;
                });
                console.log(output);
                alert(output);
            } catch (error) {
                alert(`✗ Error: ${error.message}`);
            }
        }

        async function clearDatabase() {
            if (!confirm('⚠️ This will delete ALL records. Are you sure?')) {
                return;
            }

            try {
                await DatabaseModule.clearAllAssessments();
                alert('✓ Database cleared');
                updateSummary();
            } catch (error) {
                alert(`✗ Error: ${error.message}`);
            }
        }

        async function updateSummary() {
            try {
                const stats = await DatabaseModule.getStorageStats();
                const summaryStats = document.getElementById('summary-stats');
                
                let storageDisplay = '-';
                if (stats.usedMB) {
                    storageDisplay = `${stats.usedMB} MB`;
                }

                summaryStats.innerHTML = `
                    <div class="summary-item">
                        <div class="summary-value">${testsPassed}</div>
                        <div class="summary-label">Tests Passed</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value">${testsFailed}</div>
                        <div class="summary-label">Tests Failed</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value">${stats.recordCount}</div>
                        <div class="summary-label">Total Records</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value">${storageDisplay}</div>
                        <div class="summary-label">Storage Used</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error updating summary:', error);
            }
        }

        // Update summary on page load
        window.addEventListener('load', updateSummary);
    </script>
</body>
</html>
