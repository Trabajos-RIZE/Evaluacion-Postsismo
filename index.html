<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Triage Sísmico PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
    header { background:#004080; color:white; padding:10px; text-align:center; }
    .btn { display:inline-block; padding:10px 15px; margin:5px; background:#004080; color:white; border:none; cursor:pointer; }
    .btn:disabled { background:#999; cursor:not-allowed; }
    #status { margin:10px; font-weight:bold; }
    #semaforo { width:100px; height:100px; border-radius:50%; margin:20px auto; background:gray; }
    #preview img { max-width:100px; margin:5px; border:1px solid #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>Triage Sísmico - Cali</h1>
  </header>

  <main>
    <div id="status">Buscando señal de satélites...</div>
    <div id="semaforo"></div>

    <button class="btn" id="btnFoto">Tomar Foto</button>
    <div id="preview"></div>

    <button class="btn" id="btnPDF">Exportar PDF</button>
    <button class="btn" id="btnGIS">Exportar GeoJSON</button>
  </main>

  <!-- Librerías seguras -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <script>
    // GPS con manejo de errores
    function iniciarGPS() {
      if (!navigator.geolocation) {
        document.getElementById("status").innerText = "GPS no soportado";
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          document.getElementById("status").innerText = `Coordenadas: ${lat}, ${lon}`;
          document.getElementById("semaforo").style.background = "green";
        },
        (err) => {
          document.getElementById("status").innerText = "Error GPS: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Captura fotográfica en Base64 comprimida
    document.getElementById("btnFoto").addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.createElement("video");
        video.srcObject = stream;
        await video.play();

        // Crear canvas y capturar frame
        const canvas = document.createElement("canvas");
        canvas.width = 640; canvas.height = 480;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Comprimir al 50% calidad
        const base64 = canvas.toDataURL("image/jpeg", 0.5);

        // Mostrar preview
        const img = document.createElement("img");
        img.src = base64;
        document.getElementById("preview").appendChild(img);

        // Guardar en LocalStorage (ojo límite 5MB)
        localStorage.setItem("foto_" + Date.now(), base64);

        // Detener cámara
        stream.getTracks().forEach(track => track.stop());
      } catch (err) {
        alert("Error al capturar foto: " + err.message);
      }
    });

    // Exportar PDF
    document.getElementById("btnPDF").addEventListener("click", () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Informe Técnico de Triage Sísmico", 10, 10);
      doc.autoTable({
        head: [['Columna 1', 'Columna 2']],
        body: [['Dato 1', 'Dato 2']],
        headStyles: { fillColor: [200, 200, 200] } // ✅ corregido
      });
      doc.save("triage.pdf");
    });

    // Exportar GeoJSON
    document.getElementById("btnGIS").addEventListener("click", () => {
      const geojson = {
        type: "FeatureCollection",
        features: [{
          type: "Feature",
          geometry: { type: "Point", coordinates: [-76.532, 3.451] }, // ejemplo Cali
          properties: { nota: "Reproyectar a EPSG:9377 MAGNA-SIRGAS CTM12" }
        }]
      };
      const blob = new Blob([JSON.stringify(geojson)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "triage.geojson"; a.click();
      URL.revokeObjectURL(url);
    });

    // Inicializar
    window.onload = iniciarGPS;
  </script>
</body>
</html>
